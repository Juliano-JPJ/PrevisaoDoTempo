<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="script.js"></script>
    <title>Previsão do Tempo</title>
</head>
<body>
    <div class="caixa-maior">
        <input class="input-cidade" type="text" placeholder="Digite o nome da cidade">
        <button class="botao-busca" onclick="buscar()">
            <img class="img-busca" src="https://www.svgrepo.com/show/488200/find.svg" alt="Lupa">
        </button>
        <div class="caixa-media">
            <h2 class="cidade">Digite o nome da cidade</h2>
            <p class="temp"></p>
            <div class="caixa-menor">
                <img class="img-previsao" src="https://openweathermap.org/img/wn/04n.png" alt="Nuvens">
                <p class="texto-previsao"></p>
            </div>
            <p class="umidade"></p>
        </div>
    </div>
</body>
</html>
